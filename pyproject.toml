[tool.poetry]
name = "quasar"
version = "0.1.0"
description = ""
authors = ["Justin Van Winkle <justin.vanwinkle@google.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ipython = "^8.24.0"
ipdb = "^0.13.13"
isort = "^5.13.2"
ruff = "^0.11.11"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"


[tool.isort]
force_alphabetical_sort_within_sections = true
src_paths = ["ebill"]
remove_redundant_aliases = true
force_single_line = true
